name: Remove migrated CapsuleProbe source branch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-public-probe-branch.yml'
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only previously archived experimental branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch='experiment/capsuleprobe-android17'
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          echo "Deleted public source branch: $branch"
